name: repofixlab

services:
  controller:
    build:
      context: ./packages/repofixlab
      dockerfile: docker/controller.Dockerfile
    environment:
      REPOFIXLAB_COMPOSE_PROJECT: repofixlab
      REPOFIXLAB_FACTORY_CANDIDATE_DIR: /etc/repofixlab/candidates
      REPOFIXLAB_M3_PRIVATE_VOLUME: ${REPOFIX_PRIVATE_VOLUME:-dataset-private-g-20260718-135934-066a8f5b6f6b}
      REPOFIXLAB_RUNTIME_TASK_ENVIRONMENT_LOCK_PATH: ${REPOFIXLAB_RUNTIME_TASK_ENVIRONMENT_LOCK_PATH-/opt/repofixlab/runtime-locks/m6-26-task-v1/axios-4731/task-environment-lock.json}
      REPOFIXLAB_RUNTIME_TASK_ENVIRONMENT_LOCK_ROOT: ${REPOFIXLAB_RUNTIME_TASK_ENVIRONMENT_LOCK_ROOT-/opt/repofixlab/runtime-locks/m6-26-task-v1}
      REPOFIXLAB_RUNTIME_ENABLED: ${REPOFIXLAB_RUNTIME_ENABLED:-true}
    networks:
      - repofix-control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - controller-work-v2:/var/lib/repofix/controller
      - controller-candidates-v1:/etc/repofixlab/candidates:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  orchestrator:
    image: repofixlab-orchestrator
    build:
      context: .
      dockerfile: packages/repofixlab/docker/orchestrator.Dockerfile
    depends_on:
      controller:
        condition: service_healthy
    environment:
      REPOFIX_ARTIFACTS_PATH: /artifacts
      REPOFIX_CONTROLLER_URL: http://controller:8000
      REPOFIX_IMAGE_PROVENANCE_LOCK_PATH: locks/bootstrap-image-provenance-lock.v1-m3f.json
    networks:
      - repofix-control
      - provider-egress
    volumes:
      - ./artifacts:/artifacts
    read_only: true
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  m1-runner:
    profiles:
      - m1
    image: repofixlab-orchestrator
    depends_on:
      controller:
        condition: service_healthy
    environment:
      REPOFIX_ARTIFACTS_PATH: /artifacts
      REPOFIX_CONTROLLER_URL: http://controller:8000
      REPOFIX_DATASET_PUBLIC_PATH: /data/public
      ZHIPU_API_KEY_FILE: /run/secrets/zhipu_api_key
    networks:
      - repofix-control
      - provider-egress
    volumes:
      - ./artifacts:/artifacts
      - dataset-public:/data/public:ro
    secrets:
      - zhipu_api_key
    read_only: true
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  m6-runner:
    profiles:
      - m6
    image: repofixlab-orchestrator
    depends_on:
      controller:
        condition: service_healthy
    environment:
      REPOFIX_ARTIFACTS_PATH: /artifacts
      REPOFIX_CONTROLLER_URL: http://controller:8000
      REPOFIX_DATASET_PUBLIC_PATH: /data/public
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
    networks:
      - repofix-control
      - provider-egress
    volumes:
      - ./artifacts:/artifacts
      - dataset-public:/data/public:ro
    secrets:
      - deepseek_api_key
    read_only: true
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  dataset-preparer:
    profiles:
      - dataset-prepare
    build:
      context: ./packages/repofixlab
      dockerfile: docker/dataset-preparer.Dockerfile
    environment:
      REPOFIX_PREPARER_IMAGE_ID: ${REPOFIX_PREPARER_IMAGE_ID:-}
    networks:
      - dataset-egress
    volumes:
      - dataset-source:/input:ro
      - dataset-public:/data/public
      - dataset-control:/data/control
      - dataset-private:/data/private
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    pids_limit: 64
    mem_limit: 2g
    cpus: 1.0

networks:
  repofix-control:
    internal: true
  provider-egress:
  dataset-egress:

secrets:
  zhipu_api_key:
    file: ${REPOFIX_ZHIPU_SECRET_FILE:-.repofixlab-m1-secret-unconfigured}
  deepseek_api_key:
    file: ${REPOFIX_DEEPSEEK_SECRET_FILE:-.repofixlab-m6-deepseek-secret-unconfigured}

volumes:
  controller-work-v2:
  controller-candidates-v1:
  dataset-source:
    name: ${REPOFIX_DATASET_SOURCE_VOLUME:-repofixlab-dataset-source}
  dataset-public:
    name: ${REPOFIX_PUBLIC_VOLUME:-dataset-public-unconfigured}
  dataset-control:
    name: ${REPOFIX_CONTROL_VOLUME:-dataset-control-unconfigured}
  dataset-private:
    name: ${REPOFIX_PRIVATE_VOLUME:-dataset-private-unconfigured}
